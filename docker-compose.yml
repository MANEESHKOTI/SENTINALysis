services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: sentiment-api:latest
    container_name: sentiment_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - MODEL_PATH=/app/model_output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: sentiment-ui:latest
    container_name: sentiment_ui
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
